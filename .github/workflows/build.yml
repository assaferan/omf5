name: Build and test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, flint 3 (apt)
            os: ubuntu-24.04
            flint: apt
          - name: macos, flint 3 (homebrew)
            os: macos-latest
            flint: brew
          - name: ubuntu, flint 2.9 + antic (conda-forge)
            os: ubuntu-24.04
            flint: conda

    defaults:
      run:
        shell: bash -el {0}

    steps:
    - name: Checkout omf5
      uses: actions/checkout@v4
      with:
        path: omf5

    - name: Checkout CARAT
      uses: actions/checkout@v4
      with:
        repository: lbfm-rwth/carat
        ref: 65619d6ae4ec911c8cf7aa3c9fa09866a0d36ab9
        path: carat

    - name: Install dependencies (apt)
      if: matrix.flint == 'apt' || matrix.flint == 'conda'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libgmp-dev
        if [ "${{ matrix.flint }}" = apt ]; then
          sudo apt-get install -y libflint-dev
          echo "DEPS_PREFIX=/usr" >> "$GITHUB_ENV"
        fi

    - name: Install dependencies (homebrew)
      if: matrix.flint == 'brew'
      run: |
        brew install autoconf automake libtool gmp flint
        echo "DEPS_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

    - name: Install flint 2.9 and antic (conda-forge)
      if: matrix.flint == 'conda'
      uses: mamba-org/setup-micromamba@v2
      with:
        environment-name: omf5
        create-args: libflint=2.9.0 antic=0.2.5 gmp
        init-shell: bash

    - name: Set paths (conda-forge)
      if: matrix.flint == 'conda'
      run: |
        echo "DEPS_PREFIX=$CONDA_PREFIX" >> "$GITHUB_ENV"
        echo "LD_LIBRARY_PATH=$CONDA_PREFIX/lib" >> "$GITHUB_ENV"

    - name: Build CARAT
      run: |
        cd carat
        ./autogen.sh
        ./configure --with-gmp="$DEPS_PREFIX"
        make -j4 libfunctions.a

    - name: Build omf5
      run: |
        cd omf5
        ./autogen.sh
        FLINT_PATH="$DEPS_PREFIX" GMP_PATH="$DEPS_PREFIX" ANTIC_PATH="$DEPS_PREFIX" \
          CARAT_PATH="$GITHUB_WORKSPACE/carat" ./configure
        make -j4 V=1

    - name: Run tests
      run: ./omf5/src/omf5 -tests

    - name: Check README examples
      run: cd omf5 && scripts/check_examples.sh

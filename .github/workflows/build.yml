name: Build and test

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    # Jobs without a container in the matrix run directly on the runner.
    container: ${{ matrix.container }}
    # Jobs without a compiler in the matrix use the default one.
    env:
      CC: ${{ matrix.cc }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu, flint 3 (apt)
            os: ubuntu-24.04
            flint: apt
          # Apple clang is only tested on macOS, so also build with clang
          # on Linux.
          - name: ubuntu, clang, flint 3 (apt)
            os: ubuntu-24.04
            flint: apt
            cc: clang
          - name: macos, flint 3 (homebrew)
            os: macos-latest
            flint: brew
          # The default build defines NDEBUG, which removes the assertions.
          # This job builds with them, so a failed assertion fails the tests.
          # The assertions inside #ifdef DEBUG and #ifdef DEBUG_LEVEL_FULL
          # stay off.
          - name: ubuntu, assertions, flint 3 (apt)
            os: ubuntu-24.04
            flint: apt
            cflags: -UNDEBUG
          # This job also defines DEBUG, which compiles the code and the
          # assertions inside #ifdef DEBUG. That code prints debugging output
          # to stdout, so the tests do not check the form of stdout here.
          # The code inside #ifdef DEBUG_LEVEL_FULL stays off.
          - name: ubuntu, debug, flint 3 (apt)
            os: ubuntu-24.04
            flint: apt
            cflags: -UNDEBUG -DDEBUG
            debug: 'yes'
          # Debian 12 packages flint 2.9.0 and antic 0.2.5, the oldest
          # versions omf5 supports.
          - name: debian 12, flint 2.9 + antic (apt)
            os: ubuntu-24.04
            container: debian:bookworm
            flint: debian

    defaults:
      run:
        shell: bash -el {0}

    steps:
    # Installed before the checkouts, so that the Debian container has git.
    - name: Install dependencies (ubuntu)
      if: matrix.flint == 'apt'
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf automake libtool libgmp-dev libflint-dev
        echo "DEPS_PREFIX=/usr" >> "$GITHUB_ENV"

    - name: Install dependencies (homebrew)
      if: matrix.flint == 'brew'
      run: |
        brew install autoconf automake libtool gmp flint
        echo "DEPS_PREFIX=$(brew --prefix)" >> "$GITHUB_ENV"

    - name: Install dependencies (debian)
      if: matrix.flint == 'debian'
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        apt-get update
        apt-get install -y git ca-certificates make gcc autoconf automake libtool \
          libgmp-dev libflint-dev libantic-dev
        echo "DEPS_PREFIX=/usr" >> "$GITHUB_ENV"

    - name: Checkout omf5
      uses: actions/checkout@v4
      with:
        path: omf5

    - name: Checkout CARAT
      uses: actions/checkout@v4
      with:
        repository: lbfm-rwth/carat
        ref: 65619d6ae4ec911c8cf7aa3c9fa09866a0d36ab9
        path: carat

    - name: Build CARAT
      run: |
        cd carat
        ./autogen.sh
        ./configure --with-gmp="$DEPS_PREFIX"
        make -j4 libfunctions.a

    # Jobs without cflags in the matrix pass an empty CFLAGS, the default of
    # configure.ac, and build with the flags of src/Makefile.am alone.
    - name: Build omf5
      run: |
        cd omf5
        ./autogen.sh
        FLINT_PATH="$DEPS_PREFIX" GMP_PATH="$DEPS_PREFIX" ANTIC_PATH="$DEPS_PREFIX" \
          CARAT_PATH="$GITHUB_WORKSPACE/carat" ./configure CFLAGS="${{ matrix.cflags }}"
        make -j4 V=1

    # The executable refers to the assert handler of the C library
    # (__assert_fail in glibc, __assert_rtn on macOS) exactly when assertions
    # are compiled in. This fails if the assertions job lost them, or if
    # another job has them.
    - name: Check whether the assertions are compiled in
      run: |
        case "${{ matrix.cflags }}" in *-UNDEBUG*) want=yes ;; *) want=no ;; esac
        if nm omf5/src/omf5 | grep -Eq '__assert_(fail|rtn)'; then have=yes; else have=no; fi
        echo "assertions wanted: $want, compiled in: $have"
        test "$want" = "$have"

    # A line printed only inside #ifdef DEBUG is in the executable exactly
    # when DEBUG is defined. This fails if the debug job lost the code, or if
    # another job has it.
    - name: Check whether the debugging code is compiled in
      run: |
        want=${{ matrix.debug || 'no' }}
        if grep -q 'theta_time = %f' omf5/src/omf5; then have=yes; else have=no; fi
        echo "debugging code wanted: $want, compiled in: $have"
        test "$want" = "$have"

    # Runs omf5 -tests and checks the README examples.
    - name: Run tests
      env:
        OMF5_DEBUG_BUILD: ${{ matrix.debug || 'no' }}
      run: cd omf5 && make check

    # test-suite.log includes the logs of the failing tests. It does not
    # exist if an earlier step failed.
    - name: Show test logs
      if: failure()
      run: cat omf5/test-suite.log 2>/dev/null || true
